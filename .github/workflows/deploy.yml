name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare deploy directory
        run: |
          mkdir -p _dist
          cp index.html _dist/
          cp manifest.webmanifest _dist/
          cp icon-source.svg _dist/
          cp icon-180.png _dist/
          cp icon-192.png _dist/
          cp icon-512.png _dist/
          cp -r functions _dist/functions
          ls -la _dist/
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _dist --project-name=suivi-voiture --branch=main --commit-dirty=true
